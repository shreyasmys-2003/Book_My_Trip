                <div class="container">
                    <div class="row">
                        <div class="col-md-12">
                            <button type="button" class="btn btn-success mb-3" onclick="voiceSubmit()">🎤 Submit using Voice</button>
                                <form action="{% url 'booknow' %}"  method="POST">
                                     {% csrf_token %}

                                    <input type="text" name="package_id" class="form-control mb-3" value="{{ obj.id }}">

                                    <input type="text" name="travel_mode" class="form-control mb-3" value="{{obj.travel_mode}}">

                                    <input type="text" name="name" required value="{{usr.name}}" placeholder="ENTER YOUR NAME"class="form-control w-100 mb-3">

                                    <input type="number" name="persons" required placeholder="ENTER THE NUMBER OF PERSONS" class="form-control w-100 mb-3">

                                    <input type="submit" href="" class="btn btn-dark" value="BOOK NOW">
                                    
                                </form>
                        </div>
                    </div>
                </div>


        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

    <script>
function voiceSubmit() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice not supported in this browser. Use Chrome.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.start();

    recognition.onresult = function(event) {
        const speech = event.results[0][0].transcript.toLowerCase();
        console.log("Voice:", speech);

        // simple trigger words
        if (
            speech.includes("submit") ||
            speech.includes("book") ||
            speech.includes("confirm") ||
            speech.includes("proceed")
        ) {
            document.querySelector("form").submit();
        } else {
            alert("Say: submit / book / confirm / proceed");
        }
    };

    recognition.onerror = function(event) {
        alert("Voice error: " + event.error);
    };
}
</script>

    </body>
