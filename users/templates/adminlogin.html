
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVox Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
            url("{% static 'images/elephant.jpeg' %}");
            background-size:cover;
            background-position:center;
        }

        .login-card{
            width:420px;
            padding:40px;
            border-radius:25px;
            backdrop-filter:blur(12px);
            background:rgba(255,255,255,0.15);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 8px 32px rgba(0,0,0,.25);
            color:white;
        }

        .logo{
            width:90px;
            height:90px;
            border-radius:50%;
            background:white;
            color:#0d6efd;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
            font-size:40px;
        }

        .title{
            text-align:center;
            margin-top:15px;
            font-weight:700;
        }

        .subtitle{
            text-align:center;
            color:#eaeaea;
            margin-bottom:25px;
            font-size:14px;
        }

        .form-control{
            height:50px;
            border-radius:12px;
            border:none;
            padding-left:45px;
        }

        .input-group{
            position:relative;
            margin-bottom:20px;
        }

        .input-group i{
            position:absolute;
            left:15px;
            top:17px;
            color:#666;
            z-index:10;
        }

        .btn-login{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background:linear-gradient(45deg,#ff512f,#dd2476);
            color:white;
            font-weight:600;
            transition:.3s;
        }

        .btn-login:hover{
            transform:translateY(-2px);
        }

        .footer-text{
            text-align:center;
            margin-top:20px;
            color:#ddd;
            font-size:13px;
        }

        .travel-icon{
            color:#ffc107;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="logo">
        <i class="fa-solid fa-plane-departure"></i>
    </div>

    <h2 class="title">
        TripVox Admin
    </h2>

    <p class="subtitle">
        Manage Tours, Packages & Bookings
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Admin Username"
                   required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password"
                   required>
        </div>

        <button type="submit" class="btn btn-login">
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
        </button>
    </form>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-warning mt-3">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="footer-text">
        <i class="fa-solid fa-location-dot travel-icon"></i>
        TripVox Travel Booking System
    </div>

</div>

</body>
</html>
