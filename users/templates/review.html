{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Write Review</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>

body{
background:#f5f6fa;
}


.review-container{
margin-top:20px;
}

.review-card{

background:white;
border-radius:25px;
padding:35px;

box-shadow:
0px 10px 30px rgba(0,0,0,.1);

}

.place-img{

width:100%;
height:435px;

border-radius:20px;
object-fit:cover;
}

.review-title{

font-size:30px;
font-weight:bold;

}

.star-rating{

font-size:25px;
cursor:pointer;
}

textarea{

resize:none;
height:150px;
}

.submit-btn{

padding:12px 30px;
font-weight:bold;
border-radius:30px;
}

</style>

</head>

<body>

    <nav class="navbar navbar-expand-lg sticky-top bg-white shadow-sm">

<div class="container-fluid">

<a class="navbar-brand fw-semibold">
Welcome {{user}} !
</a>

<ul class="nav navbar mx-auto">

<li class="nav-item">
<a class="nav-link fw-semibold text-dark"
href="{% url 'userhome' %}">
Home
</a>
</li>

<li class="nav-item">
<a class="nav-link fw-semibold text-dark"
href="{% url 'usercompletedorders' %}">
Completed Orders
</a>
</li>

<li class="nav-item">
<a class="nav-link fw-semibold text-dark"
href="{% url 'checklist' %}">
Checklist
</a>
</li>

<li class="nav-item">
<a class="nav-link fw-semibold text-dark"
href="{% url 'myorders' %}">
My Orders
</a>
</li>

<li class="nav-item">
<a class="nav-link fw-semibold text-dark"
href="{% url 'logout' %}">
Logout
</a>
</li>

</ul>

<h3 class="text-danger fw-bold">
TripVox
</h3>

</div>

</nav>

<h2 class="text-danger text-center mt-3">Give Feedback</h2>

<div class="container review-container">

<div class="review-card">

<div class="row">

<div class="col-md-5">

<img
src="{{tour.image.url}}"
class="place-img">

</div>


<div class="col-md-7">

<h2 class="review-title">

{{tour.placename}}

</h2>

<p class="text-muted">

Share your travel experience

</p>


<form method="POST" action="{% url 'add_review' %}">

{% csrf_token %}

<input type="text" name="tour_id" value="{{tour.id}}" hidden>

<label class="fw-bold">

Select Rating

</label>

<select name="rating" class="form-control mt-2">

<option value="5">⭐⭐⭐⭐⭐ Excellent</option>

<option value="4">⭐⭐⭐⭐ Very Good</option>

<option value="3">⭐⭐⭐ Good</option>

<option value="2">⭐⭐ Average</option>

<option value="1">⭐ Poor</option>

</select>


<label class="fw-bold mt-4"> Write Review </label>

<textarea name="review" class="form-control mt-2" placeholder="Share your experience..." required></textarea>


<button class="btn btn-success mt-4 submit-btn"><i class="fa fa-paper-plane"></i>

Submit Review

</button>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
