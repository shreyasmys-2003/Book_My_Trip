
{% load static %}
<!DOCTYPE html>
<html>
<head>

<title>TripVox Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#eef2ff,#f8fbff);
    font-family:Segoe UI,sans-serif;
}

/* Navbar */

.navbar{
    background:white;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

/* Payment Card */

.payment-card{
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    padding:35px;
    max-width:700px;
    margin:auto;
}

.payment-card h2{
    color:#dc3545;
    font-weight:700;
}

.payment-card h4{
    color:#198754;
    font-weight:700;
}

/* QR */

.qr-image{
    width:260px;
    height:260px;
    object-fit:cover;
    border-radius:15px;
    border:5px solid #f1f1f1;
    transition:.3s;
}

.qr-image:hover{
    transform:scale(1.03);
}

/* Inputs */

.form-control,
.form-select{

    border-radius:12px;
    height:48px;
    box-shadow:none;
}

.form-control:focus,
.form-select:focus{

    border-color:#dc3545;
    box-shadow:0 0 10px rgba(220,53,69,.2);
}

/* Button */

.btn-pay{

    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:#dc3545;
    color:white;
    font-weight:bold;
    transition:.3s;
}

.btn-pay:hover{

    background:#bb2d3b;
    transform:translateY(-2px);
}

.amount{

    font-size:28px;
    color:#198754;
    font-weight:bold;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg sticky-top">

<div class="container-fluid">

<a class="navbar-brand fw-bold">
Welcome {{user}}!
</a>

<ul class="nav mx-auto">

<li class="nav-item">
<a class="nav-link text-dark fw-semibold" href="{% url 'userhome' %}">Home</a>
</li>

<li class="nav-item">
<a class="nav-link text-dark fw-semibold" href="{% url 'usercompletedorders' %}">Completed Orders</a>
</li>

<li class="nav-item">
<a class="nav-link text-dark fw-semibold" href="{% url 'checklist' %}">Checklist</a>
</li>

<li class="nav-item">
<a class="nav-link text-dark fw-semibold" href="{% url 'myorders' %}">My Orders</a>
</li>

<li class="nav-item">
<a class="nav-link text-dark fw-semibold" href="{% url 'logout' %}">Logout</a>
</li>

</ul>

<h3 class="text-danger fw-bold">
TripVox
</h3>

</div>

</nav>

<div class="container py-5">

<div class="payment-card text-center">

<h2>Complete Your Payment</h2>

<p class="text-muted">

</p>

<div class="amount mb-4">
₹{{total_amount}}
</div>

<!--<img src="{% static 'images/GooglePay_QR.png' %}"
class="qr-image mb-4">-->

<form action="{% url 'pay' %}" method="POST">

{% csrf_token %}

<input type="hidden"
name="id"
value="{{show.id}}">

<div class="mb-3">

<input
type="number"
name="persons"
class="form-control"
value="{{show.persons}}"
readonly>

</div>

<div class="mb-3">

<input
type="number"
name="total_amount"
class="form-control"
value="{{total_amount}}"
readonly>

</div>

<div class="mb-3">

<input
type="text"
name="transactional_ID"
class="form-control"
placeholder="Enter Transaction ID"
required>

</div>

<div class="mb-4">

<select
name="payment_MODE"
class="form-select">

<option>GOOGLE PAY</option>
<option>PHONE PAY</option>
<option>RAZOR PAY</option>

</select>

</div>

<button class="btn-pay">
Confirm Payment
</button>

</form>

</div>

</div>

<div class="toast-container position-fixed top-0 end-0 p-3">

{% for msg in messages %}

<div class="toast text-bg-success show border-0">

<div class="d-flex">

<div class="toast-body">
{{msg}}
</div>

<button
type="button"
class="btn-close btn-close-white me-2 m-auto"
data-bs-dismiss="toast">
</button>

</div>

</div>

{% endfor %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
